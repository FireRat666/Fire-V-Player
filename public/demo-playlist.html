<!DOCTYPE html>
<html>
  <head>
  </head>
  <body>
    <script>
      // A floor to stand on, made with the BS SDK.
      window.addEventListener("bs-loaded", () => {
        const scene = (BS.Scene || BS.BanterScene).GetInstance();
        scene.On("unity-loaded", async () => {
          const floor = await new BS.GameObject({ name: "Floor", localScale: new BS.Vector3(30, 0.1, 30) }).Async();
          await floor.AddComponent(new BS.Box({ width: 1, height: 1, depth: 1 }));
          await floor.AddComponent(new BS.Material({ shaderName: "Unlit/Diffuse", color: new BS.Vector4(0.5, 0.5, 0, 1) }));
          await floor.AddComponent(new BS.BoxCollider({ isTrigger: false, size: new BS.Vector3(1, 1, 1) }));
        });
      });
    </script>

    <script src="playlist.js" instance="demo-playlist" 
            position="0 1.5 -10" rotation="0 0 0" scale="4 4 4" volume="10" mute="false" resolution="1000"

            playlist="PLYsO8Re5s33y5ZWtbWalUsNyzvtRSB_-t"></script>
  </body> 
</html>
